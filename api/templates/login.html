<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — OVS SIEM</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f05684",
            "background-dark": "#18161a",
            "card-dark": "#232126",
          },
          fontFamily: { display: ["Inter", "sans-serif"] },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-background-dark min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm mx-4">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary/10 border border-primary/20 mb-4">
        <svg class="w-6 h-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0
               003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03
               9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196
               0-6.1-1.248-8.25-3.285z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-white">OVS SIEM</h1>
      <p class="text-sm text-slate-400 mt-1">Sign in to access the dashboard</p>
    </div>

    <div class="bg-card-dark border border-slate-700/50 rounded-2xl p-8">
      {% if error %}
      <div class="mb-5 flex items-center gap-2 px-3 py-2.5 rounded-lg bg-red-500/10 border border-red-500/20 text-sm text-red-400">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0
               2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898
               0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5" for="username">Username</label>
            <input
              id="username" name="username" type="text"
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800/60 border border-slate-600/50 text-sm
                     text-slate-100 placeholder-slate-500 focus:outline-none focus:border-primary/50
                     focus:ring-1 focus:ring-primary/30"
              placeholder="admin" autocomplete="username" required autofocus>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5" for="password">Password</label>
            <input
              id="password" name="password" type="password"
              class="w-full px-3 py-2.5 rounded-lg bg-slate-800/60 border border-slate-600/50 text-sm
                     text-slate-100 placeholder-slate-500 focus:outline-none focus:border-primary/50
                     focus:ring-1 focus:ring-primary/30"
              placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>
        <button
          type="submit"
          class="mt-6 w-full py-2.5 rounded-lg bg-primary hover:bg-primary/90 text-white text-sm
                 font-semibold transition-colors">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-600 mt-6">OVS SIEM prototype — restricted access</p>
  </div>
</body>
</html>
