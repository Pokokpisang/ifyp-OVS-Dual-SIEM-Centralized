rule_exceptions:
  - id: t1059_low_risk_build_parent_exception
    description: Suppress specific T1059 low-risk build workflow events.
    enabled: true
    allow_high_risk: false
    rule_id: linux_t1059_shell_network_tool
    conditions:
      all:
        - any:
            - field: process.parent.name
              operator: in
              value:
                - npm
                - pnpm
                - make
            - field: process.normalized_command
              operator: contains_any
              value:
                - "npm install"
                - "npm run"
                - "pnpm install"
                - "make -"
        - field: process.normalized_command
          operator: not_contains_any
          value:
            - curl
            - wget
            - nc
            - ncat
            - socat
            - /tmp/
            - /dev/shm/
            - base64
            - chmod
    reason: Rule-specific exception for low-risk build workflow.

  # Known-good source allowlist for the T1078 service-account login rule.
  # allow_high_risk is true because that rule is HIGH severity — an explicitly
  # trusted source must be able to override it.
  # NOTE: 203.0.113.200 is a reserved documentation IP (TEST-NET-3) and matches
  # nothing in real traffic. Operators MUST replace it with the real IPs of trusted
  # monitoring/admin hosts that legitimately log in as a service account.
  - id: t1078_service_login_trusted_source_allowlist
    description: Suppress T1078 service-account logins from explicitly trusted source IPs.
    enabled: true
    allow_high_risk: true
    rule_id: linux_t1078_003_service_account_login
    conditions:
      all:
        - field: source.ip
          operator: in
          value:
            - "203.0.113.200"
    reason: Login from an explicitly trusted administrative/monitoring source IP.
