id: linux_t1078_003_service_account_login
name: Suspicious Interactive Login by Service Account
description: >
  Detects a successful interactive SSH login by a service/daemon account
  (e.g. www-data, postgres, nginx, redis) that should never log in interactively.
  A successful login as one of these accounts is a strong indicator of valid-account
  abuse (MITRE T1078.003). Sudo abuse and privileged-user external-login framings are
  intentionally out of scope for this rule (the parser has no sudo path today).
enabled: true
platform:
  - linux
log_source:
  product: linux
  service: auth
severity: high
risk_score: 65
mitre:
  tactic:
    id: TA0005
    name: Defense Evasion
  technique:
    id: T1078
    name: Valid Accounts
  subtechnique:
    id: T1078.003
    name: Local Accounts
tags:
  - Linux
  - T1078
  - T1078.003
  - Defense Evasion
  - Rule-Based Detection
required_fields:
  - event.outcome
  - user.name
condition:
  all:
    - field: event.outcome
      operator: equals
      value: success
    - field: event.category
      operator: equals
      value: authentication
    - field: service.name
      operator: equals
      value: ssh
    - field: user.name
      operator: in
      value:
        - www-data
        - nginx
        - apache
        - apache2
        - httpd
        - postgres
        - mysql
        - mariadb
        - redis
        - mongodb
        - memcached
        - rabbitmq
        - elasticsearch
        - nobody
        - daemon
        - bin
        - sys
        - mail
        - ftp
        - proxy
        - backup
        - sshd
        - systemd-network
        - systemd-resolve
        - systemd-timesync
        - messagebus
        - ntp
risk_adjustment:
  increase_if:
    # External source (+15), absence-safe: only fires when source.ip is present
    # AND does not look like an RFC1918 / loopback address.
    - all:
        - field: source.ip
          operator: exists
        - not:
            field: source.ip
            operator: regex
            # Internal/non-routable ranges (IPv4 RFC1918 + loopback, and IPv6
            # loopback ::1, link-local fe80:, ULA fc00::/7 = fc/fd). Anything
            # else is treated as external.
            value: '^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|::1$|fe80:|fc|fd)'
      add_score: 15
      reason: Service-account login from an external (non-RFC1918) source
false_positives:
  - Deploy/CI pipelines intentionally granted SSH under a shared account (e.g. reusing www-data)
  - Monitoring or backup systems logging in as a service account from a known host
  - Administrators using `su`/`sudo -u` to a service account (appears as a session, not an SSH login)
investigation_guide: |
  1. Confirm whether the service account is supposed to have interactive SSH access — most never do.
  2. Identify the source IP and whether it belongs to known infrastructure.
  3. Review what the session did after login (spawned shells, file writes, network connections).
  4. Check for preceding failed logins from the same source (possible credential compromise → see T1110).
  5. If unexpected, rotate the account's credentials/keys and review authorized_keys for the account.
references:
  - https://attack.mitre.org/techniques/T1078/003/
