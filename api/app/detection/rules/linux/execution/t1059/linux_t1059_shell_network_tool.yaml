id: linux_t1059_shell_network_tool
name: Suspicious Shell With Network Tool
description: Detects Unix shell execution combined with network-capable tools such as curl, wget, nc, ncat, socat, or openssl.
enabled: true
platform:
  - linux
log_source:
  product: linux
  service: auditd
severity: high
risk_score: 67
mitre:
  tactic:
    id: TA0002
    name: Execution
  technique:
    id: T1059
    name: Command and Scripting Interpreter
  subtechnique:
    id: T1059.004
    name: Unix Shell
tags:
  - Linux
  - T1059
  - T1059.004
  - Rule-Based Detection
required_fields:
  - process.name
  - process.command_line
  - user.name
  - host.name
condition:
  all:
    - field: process.name
      operator: in
      value:
        - sh
        - bash
        - dash
        - zsh
    - field: process.normalized_command
      operator: contains_any
      value:
        - curl
        - wget
        - nc
        - ncat
        - socat
        - openssl
    - field: process.normalized_command
      operator: contains_any
      value:
        - "| bash"
        - "| sh"
        - "| /bin/bash"
        - "| /bin/sh"
        - "bash -c"
        - "sh -c"
        - "bash <"
        - "sh <"
risk_adjustment:
  increase_if:
    - field: process.normalized_command
      operator: contains_any
      value:
        - "/tmp/"
        - "/dev/shm/"
        - "chmod"
        - "base64"
      add_score: 20
      reason: Shell command contains secondary high-risk indicators
    - field: process.normalized_command
      operator: contains_any
      value:
        - "base64 -d"
        - "base64 --decode"
      add_score: 10
      reason: Encoded-payload decode-and-run staging indicator
    - field: process.normalized_command
      operator: contains_all
      value:
        - "chmod"
        - "+x"
      add_score: 15
      reason: Marks a downloaded file executable in the same command (drop-and-run)
    - field: process.normalized_command
      operator: contains_any
      value:
        - "/var/tmp/"
      add_score: 10
      reason: Execution references world-writable temp directory
    - field: process.parent.name
      operator: in
      value:
        - nginx
        - apache
        - apache2
        - httpd
        - php-fpm
        - python
        - python3
        - perl
      add_score: 20
      reason: Shell spawned by suspicious parent process (web server or interpreter)
  decrease_if:
    - field: process.parent.name
      operator: in
      value:
        - npm
        - pnpm
        - make
        - node-gyp
      subtract_score: 20
      reason: Likely package/build workflow
false_positives:
  - Legitimate package installation scripts
  - Build scripts using curl or wget
  - System administrator maintenance scripts
investigation_guide: |
  1. Review the full command line and parent process hierarchy.
  2. Determine if the network tool was used to download and execute code (e.g., pipes to shell).
  3. Investigate the reputation of the destination domain or IP address.
  4. Check for any dropped files in temporary directories like /tmp or /dev/shm.
  5. Verify the user context and whether this activity is typical for this host.
references:
  - https://github.com/elastic/detection-rules
