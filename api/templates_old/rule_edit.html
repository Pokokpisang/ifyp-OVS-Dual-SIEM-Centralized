{% extends "base.html" %}

{% block title %}Edit Rule: {{ rule.name }}{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 800px;">
    <form action="/rules/save" method="post">
        <input type="hidden" name="id" value="{{ rule.id }}">

        <div style="margin-bottom: 20px;">
            <label>Rule Name</label>
            <input type="text" name="name" value="{{ rule.name }}" style="width: 100%;">
        </div>

        <div style="margin-bottom: 20px;">
            <label>Default Severity</label>
            <select name="severity">
                <option value="HIGH" {% if rule.severity_default=='HIGH' %}selected{% endif %}>HIGH</option>
                <option value="MED" {% if rule.severity_default=='MED' %}selected{% endif %}>MED</option>
                <option value="LOW" {% if rule.severity_default=='LOW' %}selected{% endif %}>LOW</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label>Detection Logic (JSON)</label>
            <textarea name="logic" rows="15"
                style="width: 100%; background: #111; color: #ddd; font-family: monospace; border: 1px solid var(--border); padding: 10px;">{{ rule.logic_json }}</textarea>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">
                Supports "keywords": [] and "patterns": [{"all_of": ["regex|or", "must_exist"]}]
            </div>
        </div>

        <button type="submit" style="background: var(--primary); border: none; font-weight: bold; cursor: pointer;">Save
            Changes</button>
        <a href="/rules" style="margin-left: 15px; color: var(--text-muted); text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
